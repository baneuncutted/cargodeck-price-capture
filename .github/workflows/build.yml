name: App bauen

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Bauen
        run: dotnet publish CargoDeckScanner.csproj -c Release -o out
      - name: Prüfsumme
        shell: pwsh
        run: (Get-FileHash out/CargoDeckPriceCapture.exe -Algorithm SHA256).Hash | Out-File out/SHA256.txt -Encoding ascii
      - name: Als Download speichern
        uses: actions/upload-artifact@v4
        with:
          name: CargoDeckPriceCapture
          path: out/*
      - name: An das Release hängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} out/CargoDeckPriceCapture.exe out/SHA256.txt --clobber
