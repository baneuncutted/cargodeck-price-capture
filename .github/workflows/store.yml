name: Store Paket bauen

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, vier Zahlen, die letzte immer 0, zum Beispiel 1.2.0.0"
        required: true
        default: "1.6.0.0"
      name:
        description: "Name im Store, muss im Partner Center reserviert sein"
        required: true
        type: choice
        default: "Cargo Deck Price Capture"
        options:
          - "Cargo Deck Price Capture"
          - "Cargo Deck Scanner"

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version prüfen
        shell: pwsh
        run: |
          if ("${{ inputs.version }}" -notmatch '^\d+\.\d+\.\d+\.0$') { Write-Error "Version muss so aussehen 1.2.0.0, die letzte Zahl 0"; exit 1 }

      - name: App bauen
        run: dotnet publish CargoDeckScanner.csproj -c Release -o pkg -p:PublishSingleFile=false -p:SelfContained=true -p:RuntimeIdentifier=win-x64

      - name: Paket vorbereiten
        shell: pwsh
        run: |
          # Logos und Manifest suchen, egal ob sie im Ordner Package, Assets oder direkt im Repo liegen
          New-Item -ItemType Directory -Force pkg/Assets | Out-Null
          $logos = Get-ChildItem -Recurse -File -Include 'Square44x44Logo*.png','Square150x150Logo*.png','Wide310x150Logo*.png','StoreLogo*.png','SplashScreen*.png' | Where-Object { $_.FullName -notmatch '\\(pkg|bin|obj)\\' }
          if (-not $logos) { Write-Error "Keine Logos gefunden. Bitte die PNG Dateien aus Package/Assets ins Repo hochladen."; exit 1 }
          $logos | ForEach-Object { Copy-Item $_.FullName (Join-Path 'pkg/Assets' $_.Name) -Force }
          Write-Host "Logos:" ($logos.Name -join ', ')
          $mf = Get-ChildItem -Recurse -File -Filter AppxManifest.xml | Where-Object { $_.FullName -notmatch '\\(pkg|bin|obj)\\' } | Select-Object -First 1
          if (-not $mf) { Write-Error "AppxManifest.xml nicht gefunden. Bitte aus dem Ordner Package hochladen."; exit 1 }
          Write-Host "Manifest:" $mf.FullName
          $m = Get-Content $mf.FullName -Raw -Encoding UTF8
          $m = $m.Replace('__VERSION__', '${{ inputs.version }}').Replace('__NAME__', '${{ inputs.name }}')
          [IO.File]::WriteAllText("$PWD/pkg/AppxManifest.xml", $m, (New-Object Text.UTF8Encoding $false))

      - name: MSIX packen
        shell: pwsh
        run: |
          $mk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter makeappx.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mk) { Write-Error "makeappx nicht gefunden"; exit 1 }
          & $mk.FullName pack /d pkg /p "CargoDeckPriceCapture_${{ inputs.version }}_x64.msix" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Store-${{ inputs.version }}-${{ inputs.name }}
          path: "*.msix"
